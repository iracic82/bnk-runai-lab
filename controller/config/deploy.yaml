# BNK <-> Run:ai tenancy controller: one BNK tenant per Run:ai project.
apiVersion: v1
kind: Namespace
metadata:
  name: bnk-runai-tenancy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bnk-runai-tenancy
  namespace: bnk-runai-tenancy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bnk-runai-tenancy
rules:
  # Run:ai side: read only. Run:ai's webhook lets only Run:ai's own services write projects.
  - apiGroups: ["kai.resources"]
    resources: ["projects", "departments"]
    verbs: ["get", "list", "watch"]
  # A project's namespace says which inference engine it runs (tenancy.f5.com/engine). Read only.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # BNK side: the tenant objects it renders (Gateway API, GAIE, F5 EPP, iRule, NetPolicy).
  - apiGroups: ["gateway.networking.k8s.io", "inference.networking.k8s.io", "inference.k8s.f5.com", "k8s.f5net.com", "gateway.k8s.f5.com"]
    resources: ["gateways", "httproutes", "inferencepools", "f5-epps", "f5-big-cne-irules", "netpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # BNK's registry credential, copied into each tenant namespace for its Endpoint Picker.
  # Create/patch is cluster-wide because Run:ai creates tenant namespaces at runtime; the controller
  # only ever writes the one secret name, labelled managed-by bnk-runai-tenancy.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["far-pull-secret"]
    verbs: ["get", "patch", "delete"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bnk-runai-tenancy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bnk-runai-tenancy
subjects:
  - kind: ServiceAccount
    name: bnk-runai-tenancy
    namespace: bnk-runai-tenancy
---
# The VIP map is the only ConfigMap the controller touches: namespaced, not cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bnk-runai-tenancy-vips
  namespace: f5-bnk
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["bnk-runai-tenancy-vips"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["far-pull-secret"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bnk-runai-tenancy-vips
  namespace: f5-bnk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bnk-runai-tenancy-vips
subjects:
  - kind: ServiceAccount
    name: bnk-runai-tenancy
    namespace: bnk-runai-tenancy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bnk-runai-tenancy
  namespace: bnk-runai-tenancy
  labels: {app.kubernetes.io/name: bnk-runai-tenancy}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: bnk-runai-tenancy}
  template:
    metadata:
      labels: {app.kubernetes.io/name: bnk-runai-tenancy}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: bnk-runai-tenancy
      nodeSelector: {app: runai-control-plane}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: manager
          image: docker.io/iracic82/bnk-runai-tenancy:0.1.8
          imagePullPolicy: Always
          # Token metering: the iRules send usage from TMM to the meter on the control node, which sits on
          # TMM's external network as 10.1.10.11 (platform/cluster/setup-cluster.sh). Remove both metering
          # flags to run without metering.
          args: ["--leader-elect", "--bnk-namespace=f5-bnk", "--vip-range=172.16.201.110-172.16.201.149",
                 "--metering-sink=10.1.10.11:5514", "--metering-token-file=/var/run/bnk-metering/token"]
          volumeMounts:
            - {name: metering-token, mountPath: /var/run/bnk-metering, readOnly: true}
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: probes, containerPort: 8081}
          livenessProbe: {httpGet: {path: /healthz, port: probes}}
          readinessProbe: {httpGet: {path: /readyz, port: probes}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, readOnlyRootFilesystem: true}
      volumes:
        - name: metering-token
          secret: {secretName: bnk-metering-token, items: [{key: token, path: token}]}
---
apiVersion: v1
kind: Service
metadata:
  name: bnk-runai-tenancy-metrics
  namespace: bnk-runai-tenancy
  labels: {app.kubernetes.io/name: bnk-runai-tenancy}
spec:
  selector: {app.kubernetes.io/name: bnk-runai-tenancy}
  ports: [{name: metrics, port: 8080, targetPort: metrics}]
