# TMM data-path NetworkAttachmentDefinitions (Multus). These give TMM its two data NICs, exactly as
# the UDF does: external-net (client -> VIP) and internal-net (TMM -> backend pods). The order in
# CNEInstance.networkAttachments maps to TMM interface names: [external-net, internal-net] ->
# 1.1 = external-net, 1.2 = internal-net, which the F5SPKVlans (19-bnk-net-vlans.yaml) then reference.
#
# The UDF masters external-net on a real NIC (ens6) and internal-net on br0 (a gretap bridge). We have
# single-NIC nodes, so BOTH are gretap bridges built by scripts/pcie-overlay.sh: br0 = internal (10.1.20.x),
# br1 = external (10.1.10.x). macvlan-on-a-bridge is exactly what the UDF does for internal-net.
#
# These MUST exist before TMM is created (TMM's macvlan legs are attached at pod creation), so setup-bnk
# applies this file BEFORE the BNK install.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: external-net
  namespace: f5-bnk
spec:
  config: '{"cniVersion":"0.3.1","type":"macvlan","master":"br1","mode":"bridge","ipam":{}}'
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: internal-net
  namespace: f5-bnk
spec:
  config: '{"cniVersion":"0.3.1","type":"macvlan","master":"br0","mode":"bridge","ipam":{}}'
---
# The genai-perf client's leg on external-net: a static IP (10.1.10.101) plus a route that sends the
# BNK VIP subnet (172.16.201.0/24) to TMM's external self-IP (10.1.10.201). This mirrors the UDF client
# that sits on external-net and routes the VIPs to TMM. Only the VIP subnet rides external-net; the pod's
# default route stays on Calico (so DNS and the HF tokenizer fetch still work).
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: external-net-client
  namespace: f5-bnk
spec:
  config: '{"cniVersion":"0.3.1","type":"macvlan","master":"br1","mode":"bridge","ipam":{"type":"static","addresses":[{"address":"10.1.10.101/24"}],"routes":[{"dst":"172.16.201.0/24","gw":"10.1.10.201"}]}}'
