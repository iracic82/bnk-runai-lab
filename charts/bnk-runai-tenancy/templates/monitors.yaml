{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "bnk-runai-tenancy.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bnk-runai-tenancy.labels" . | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "bnk-runai-tenancy.selectorLabels" . | nindent 6 }}
  endpoints:
    - {port: metrics, path: /metrics, interval: {{ .Values.monitoring.interval }}}
{{- if .Values.metering.enabled }}
---
# bnk_requests_total, bnk_tokens_total. The meter's own project/department/model labels win.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "bnk-runai-tenancy.meterName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bnk-runai-tenancy.meterLabels" . | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "bnk-runai-tenancy.meterSelectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - portNumber: {{ .Values.meter.metricsPort }}
      path: /metrics
      interval: {{ .Values.monitoring.interval }}
      honorLabels: true
{{- end }}
{{- end }}
