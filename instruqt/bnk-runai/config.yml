version: "3"
# BNK 2.4 x open-source NVIDIA Run:ai on a real four-node Kubernetes cluster.
# Cluster + BNK are the proven bnk-ai-kv-lab setup (platform/cluster/setup-cluster.sh); Run:ai is
# installed on top from images published by the runai-image-build track (docs/build-and-deploy-flow.md).
virtualmachines:
# Control plane and the host the learner works on (Grafana, Prometheus, the tenancy controller).
- name: control
  image: f5/bnk-f5
  machine_type: n2-standard-16
  shell: /bin/bash
  ports:
  - 3000   # grafana
  - 3001   # browser for the Run:ai UI (platform/browser)
  - 3002   # interactive lab topology (platform/topology)
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
    LAB_ROOT: /root/lab
# Simulated BlueField DPU: runs BNK's TMM data plane, one end of the gretap "pcie" link.
- name: dpu
  image: f5/bnk-f5
  machine_type: n2-standard-8
  shell: /bin/bash
# GPU server: fake GPUs, Run:ai cluster agent and scheduler, model pods; other end of the pcie link.
- name: gpu
  image: f5/bnk-f5
  machine_type: n2-standard-16
  shell: /bin/bash
# Run:ai control plane (about 50 services incl. Keycloak, Postgres, NATS), kept off the BNK nodes.
- name: runai
  image: f5/bnk-f5
  # 32 vCPU: the Run:ai control plane, the tenancy controller and both MCP servers all pin here; at 16 the
  # CPU requests filled the node and new pods stayed Pending. Booted cleanly at 32 (2026-10-16). Instruqt
  # only accepts listed machine types, and n2-standard-24 is not one of them.
  machine_type: n2-standard-32
  shell: /bin/bash
# Team secrets (write only): FAR_PULL_B64 F5 registry credential, BNK_LICENSE_JWT licence,
# GH_READ_TOKEN read-only token for the private lab repo, LLM_API_KEY NVIDIA API key (build.nvidia.com)
# for the MCP agent in challenge 6. DOCKERHUB_PULL_TOKEN: read-only Docker Hub token for iracic82 (paid
# plan), so image pulls are not held to the anonymous 100 per hour that hot-pool sandboxes share.
secrets:
- name: FAR_PULL_B64
  key: FAR_PULL_B64
- name: BNK_LICENSE_JWT
  key: BNK_LICENSE_JWT
- name: GH_READ_TOKEN
  key: GH_READ_TOKEN
- name: LLM_API_KEY
  key: LLM_API_KEY
- name: DOCKERHUB_PULL_TOKEN
  key: DOCKERHUB_PULL_TOKEN
