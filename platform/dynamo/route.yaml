# BNK -> Dynamo frontend, with plain Gateway API (kinds verified on BNK 2.4, docs/verified-names.md).
# The tenancy controller already gave Run:ai project "dynamo" its Gateway dynamo (VIP:8000)
# and a /v1 route to the InferencePool. This route attaches to the same Gateway with longer path
# prefixes, so the OpenAI endpoints go straight to the Dynamo frontend Service and Dynamo's own
# KV-aware router picks the worker. No Dynamo-specific BNK CRD is used: none could be verified.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dynamo-route
  labels: {app.kubernetes.io/part-of: dynamo-runtime}
spec:
  parentRefs:
  - {name: dynamo, namespace: f5-bnk, sectionName: http}
  rules:
  - matches:
    - path: {type: PathPrefix, value: /v1/chat/completions}
    - path: {type: PathPrefix, value: /v1/completions}
    - path: {type: PathPrefix, value: /v1/models}
    backendRefs:
    - {name: dynamo-frontend, port: 8000}
