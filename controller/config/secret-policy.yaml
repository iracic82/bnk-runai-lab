# Enforced at the API server (ValidatingAdmissionPolicy, GA in Kubernetes 1.30): the tenancy controller
# may write exactly one Secret, BNK's registry credential, and only into Run:ai project namespaces. RBAC
# cannot scope "create" by name or namespace pattern, so this closes that gap even if the controller's
# credentials leak.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bnk-runai-tenancy-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["secrets"]
        operations: ["CREATE", "UPDATE", "DELETE"]
  matchConditions:
    - name: only-the-tenancy-controller
      expression: request.userInfo.username == "system:serviceaccount:bnk-runai-tenancy:bnk-runai-tenancy"
  validations:
    - expression: request.name == "far-pull-secret"
      message: "the tenancy controller may only write the far-pull-secret registry secret"
    - expression: request.namespace.matches('^runai-[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      message: "the tenancy controller may only write secrets into Run:ai project namespaces (runai-*)"
    # The new object (CREATE, UPDATE) must be a registry secret labelled as ours ...
    - expression: >-
        request.operation == "DELETE" ||
        (object.type == "kubernetes.io/dockerconfigjson" &&
         has(object.metadata.labels) &&
         object.metadata.labels[?"app.kubernetes.io/managed-by"].orValue("") == "bnk-runai-tenancy")
      message: "the tenancy controller may only write registry secrets it labels as its own"
    # ... and the existing one (UPDATE, DELETE) must already be ours, so nobody else's secret of the
    # same name can be overwritten or removed.
    - expression: >-
        request.operation == "CREATE" ||
        (has(oldObject.metadata.labels) &&
         oldObject.metadata.labels[?"app.kubernetes.io/managed-by"].orValue("") == "bnk-runai-tenancy")
      message: "the tenancy controller may only change or remove a registry secret it already owns"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bnk-runai-tenancy-secrets
spec:
  policyName: bnk-runai-tenancy-secrets
  validationActions: [Deny]
