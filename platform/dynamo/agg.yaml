# Dynamo aggregated serving, GPU-free: 1 frontend (KV-aware router) + 2 Mocker decode workers.
# Plain Deployments, no Dynamo operator. Every pod is scheduled by Run:ai (kai-scheduler, queue
# "dynamo"); the workers each take half of a simulated A10.
# Image and flags are from ai-dynamo/dynamo v1.5.1, see docs/dynamo-research.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-frontend
  labels: {app: dynamo-frontend, dynamo.role: frontend}
spec:
  replicas: 1
  selector: {matchLabels: {app: dynamo-frontend}}
  template:
    metadata:
      labels:
        app: dynamo-frontend
        dynamo.role: frontend
        kai.scheduler/queue: dynamo
        # The tenant's InferencePool selects this label, so BNK's pool points at the Dynamo frontend.
        app.kubernetes.io/part-of: model-server
    spec:
      schedulerName: kai-scheduler
      nodeSelector: {app: workload}
      containers:
      - name: frontend
        image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:1.5.1
        workingDir: /workspace
        command: ["python3", "-m", "dynamo.frontend"]
        args: ["--http-port", "8000", "--router-mode", "kv"]
        env:
        - {name: DYN_DISCOVERY_BACKEND, value: etcd}
        - {name: ETCD_ENDPOINTS, value: "http://dynamo-etcd:2379"}
        - {name: NATS_SERVER, value: "nats://dynamo-nats:4222"}
        - {name: DYN_REQUEST_PLANE, value: tcp}
        - {name: DYN_EVENT_PLANE, value: nats}
        - name: DYN_TCP_RPC_HOST
          valueFrom: {fieldRef: {fieldPath: status.podIP}}
        - {name: HF_HOME, value: /tmp/hf}
        - name: HF_TOKEN
          valueFrom: {secretKeyRef: {name: hf-token, key: HF_TOKEN, optional: true}}
        ports: [{name: http, containerPort: 8000}]
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          periodSeconds: 5
          failureThreshold: 60
        resources:
          requests: {cpu: 500m, memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: dynamo-frontend
spec:
  selector: {app: dynamo-frontend}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-decode
  labels: {app: dynamo-decode, dynamo.role: worker}
spec:
  replicas: 2
  selector: {matchLabels: {app: dynamo-decode}}
  template:
    metadata:
      labels:
        app: dynamo-decode
        dynamo.role: worker
        kai.scheduler/queue: dynamo
      annotations:
        # Run:ai GPU sharing: half of one simulated A10 per worker.
        gpu-fraction: "0.5"
    spec:
      schedulerName: kai-scheduler
      nodeSelector: {app: workload}
      containers:
      - name: mocker
        image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:1.5.1
        workingDir: /workspace
        command: ["python3", "-m", "dynamo.mocker"]
        args:
        - --model-path=Qwen/Qwen3-0.6B
        - --model-name=Qwen/Qwen3-0.6B
        - --speedup-ratio=5.0
        # Small KV blocks so short lab prompts fill whole blocks and prefix reuse shows up.
        - --block-size=16
        - --num-gpu-blocks-override=4096
        env:
        - {name: DYN_DISCOVERY_BACKEND, value: etcd}
        - {name: ETCD_ENDPOINTS, value: "http://dynamo-etcd:2379"}
        - {name: NATS_SERVER, value: "nats://dynamo-nats:4222"}
        - {name: DYN_REQUEST_PLANE, value: tcp}
        - {name: DYN_EVENT_PLANE, value: nats}
        - name: DYN_TCP_RPC_HOST
          valueFrom: {fieldRef: {fieldPath: status.podIP}}
        - {name: HF_HOME, value: /tmp/hf}
        - name: HF_TOKEN
          valueFrom: {secretKeyRef: {name: hf-token, key: HF_TOKEN, optional: true}}
        resources:
          requests: {cpu: 500m, memory: 1Gi}
