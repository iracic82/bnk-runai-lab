{{- if and .Values.metering.enabled (not .Values.metering.token.existingSecret) }}
{{- /*
The metering token is shared by the controller (rendered into each iRule) and the meter (checks the
iRule's "auth" line, authenticates /bnk/flush). Generated once and reused on upgrade: rotating it would
desync running iRules from the meter until the controller re-renders them.
The token is visible to anyone who can read F5BigCneIrule objects in the BNK namespace: it raises the
bar against forging usage from the network, but RBAC on that namespace is the real boundary.
*/ -}}
{{- $secretName := include "bnk-runai-tenancy.meteringSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $token := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "token") }}
{{- $token = index $existing.data "token" }}
{{- else }}
{{- $token = randAlphaNum 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bnk-runai-tenancy.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: metering
  annotations:
    # Keep the token if the release is uninstalled and reinstalled: live iRules still carry it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ $token }}
{{- end }}
