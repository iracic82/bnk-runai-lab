# Optional: disaggregated serving. One Mocker prefill worker and one Mocker decode worker, each on
# half a simulated A10. Applying this replaces the aggregated dynamo-decode Deployment (same name),
# so the project still uses 1 GPU in total. The frontend from agg.yaml stays as it is.
# Flags from the upstream local Mocker guide (prefill uses --bootstrap-ports), ai-dynamo/dynamo v1.5.1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-prefill
  labels: {app: dynamo-prefill, dynamo.role: worker}
spec:
  replicas: 1
  selector: {matchLabels: {app: dynamo-prefill}}
  template:
    metadata:
      labels:
        app: dynamo-prefill
        dynamo.role: worker
        dynamo.stage: prefill
        kai.scheduler/queue: dynamo
      annotations:
        gpu-fraction: "0.5"
    spec:
      schedulerName: kai-scheduler
      nodeSelector: {app: workload}
      containers:
      - name: mocker
        image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:1.5.1
        workingDir: /workspace
        command: ["python3", "-m", "dynamo.mocker"]
        args:
        - --model-path=Qwen/Qwen3-0.6B
        - --model-name=Qwen/Qwen3-0.6B
        - --speedup-ratio=5.0
        - --block-size=16
        - --num-gpu-blocks-override=4096
        - --disaggregation-mode=prefill
        - --bootstrap-ports=50100
        env:
        - {name: DYN_DISCOVERY_BACKEND, value: etcd}
        - {name: ETCD_ENDPOINTS, value: "http://dynamo-etcd:2379"}
        - {name: NATS_SERVER, value: "nats://dynamo-nats:4222"}
        - {name: DYN_REQUEST_PLANE, value: tcp}
        - {name: DYN_EVENT_PLANE, value: nats}
        - name: DYN_TCP_RPC_HOST
          valueFrom: {fieldRef: {fieldPath: status.podIP}}
        - {name: HF_HOME, value: /tmp/hf}
        - name: HF_TOKEN
          valueFrom: {secretKeyRef: {name: hf-token, key: HF_TOKEN, optional: true}}
        resources:
          requests: {cpu: 500m, memory: 1Gi}
---
